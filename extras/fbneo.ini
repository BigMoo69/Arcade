# Opciones de FinalBurn Neo (opcional). Formato: clave = valor
# Quita el "#" de una línea para activarla.

# Modo NeoGeo: MVS (arcade, con monedas) / AES (consola) / UNIBIOS (requiere uni-bios en neogeo.zip)
# fbneo-neogeo-mode = MVS

# Permitir combinaciones imposibles (izquierda+derecha a la vez)
# fbneo-allow-opposite-directions = disabled

# Velocidad de la CPU emulada (reduce lag en algunos juegos)
# fbneo-cpu-speed-adjust = 100%

# Frameskip
# fbneo-frameskip = 0
